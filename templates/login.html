<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GDEF-L1NK</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #05070c;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: #0d111a;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid #1d2f52;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.65);
            width: 300px;
            text-align: center;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #4d8dff; }
        input[type="password"] {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 1rem;
            border: 1px solid #253655;
            border-radius: 4px;
            background: #080b12;
            color: #fff;
            box-sizing: border-box;
        }
        input[type="password"]:focus {
            border-color: #4d8dff;
            box-shadow: 0 0 0 2px rgba(77, 141, 255, 0.22);
            outline: none;
        }
        button {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 4px;
            background: #1e3c72;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #2a5298; }
        .error { color: #ff0000; margin-bottom: 1rem; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>GDEF-L1NK</h1>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <input type="password" name="token" placeholder="Access Token" required autofocus>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
