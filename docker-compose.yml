# GDEF-L1NK — Docker Compose stack (driven by ./run.sh).
#
#   db   PostgreSQL (persistent: known MACs, pinned IPs, threat list, live table)
#   app  Flask sniffer + web UI, host networking so Scapy sees the real NIC
#
# Quick start:
#   cp .env.example .env      # set NETWORK_INTERFACE + a real DB password
#   ./run.sh start
#
# The app uses host networking and reaches PostgreSQL on 127.0.0.1 via the db
# container's published port. That port defaults to 55432 (not 5432) so it never
# clashes with a system PostgreSQL already listening on 5432. It is bound to
# loopback only, so the database is never exposed to the LAN.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gdef_l1nk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gdef_l1nk}
      POSTGRES_DB: ${POSTGRES_DB:-gdef_l1nk}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gdef_l1nk} -d ${POSTGRES_DB:-gdef_l1nk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    # Required for Scapy to capture from the physical interface. Host networking
    # alone is not enough — the kernel also needs the raw-socket capabilities.
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      db:
        condition: service_healthy
    # All app configuration (NETWORK_INTERFACE, APP_HOST/PORT, ACCESS_TOKEN,
    # FLASK_SECRET_KEY, POSTGRES_*, ...) comes from .env.
    env_file:
      - .env
    environment:
      # Host networking → connect to the db container's published loopback port.
      # Set explicitly here so it always wins over any DATABASE_URL left in .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-gdef_l1nk}:${POSTGRES_PASSWORD:-gdef_l1nk}@127.0.0.1:${POSTGRES_PORT:-55432}/${POSTGRES_DB:-gdef_l1nk}
    volumes:
      # geo .mmdb datasets + generated secrets/config persist on the host.
      - ./database:/app/database

volumes:
  pgdata:
